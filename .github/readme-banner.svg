<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 260">
  <title id="title">Cindr3D workflow banner</title>
  <desc id="desc">Animated banner showing Cindr3D moving from design to slice to print.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="48%" stop-color="#14315f"/>
      <stop offset="100%" stop-color="#0b3b35"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <circle cx="170" cy="62" r="92" fill="#ff6b35" opacity=".18" filter="url(#soft)">
    <animate attributeName="cx" values="170;230;170" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="206" r="120" fill="#00a86b" opacity=".16" filter="url(#soft)">
    <animate attributeName="cy" values="206;170;206" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".22" stroke="#ffffff" stroke-width="1">
    <path d="M0 210 H1200"/>
    <path d="M0 170 H1200"/>
    <path d="M0 130 H1200"/>
    <path d="M0 90 H1200"/>
    <path d="M120 0 V260"/>
    <path d="M280 0 V260"/>
    <path d="M440 0 V260"/>
    <path d="M600 0 V260"/>
    <path d="M760 0 V260"/>
    <path d="M920 0 V260"/>
    <path d="M1080 0 V260"/>
  </g>

  <g transform="translate(88 58)">
    <rect x="0" y="0" width="242" height="144" rx="20" fill="#0b1220" opacity=".78" stroke="#38bdf8"/>
    <path d="M70 92 L70 42 L158 42 L158 92 Z" fill="#1d4ed8" opacity=".32" stroke="#60a5fa" stroke-width="3"/>
    <path d="M70 42 L112 20 L200 20 L158 42" fill="none" stroke="#93c5fd" stroke-width="3"/>
    <path d="M158 42 L200 20 L200 70 L158 92" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <text x="26" y="126" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Design</text>
  </g>

  <g transform="translate(478 58)">
    <rect x="0" y="0" width="242" height="144" rx="20" fill="#0b1220" opacity=".78" stroke="#a78bfa"/>
    <path d="M62 84 C112 36 158 114 206 66" fill="none" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
    <path d="M50 104 H214" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <text x="26" y="126" fill="#ede9fe" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Slice</text>
  </g>

  <g transform="translate(868 58)">
    <rect x="0" y="0" width="242" height="144" rx="20" fill="#0b1220" opacity=".78" stroke="#34d399"/>
    <path d="M70 92 H182 V106 H70 Z" fill="#065f46" stroke="#6ee7b7" stroke-width="3"/>
    <path d="M88 92 V44 H164 V92" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="126" cy="68" r="18" fill="#10b981" opacity=".45">
      <animate attributeName="r" values="15;22;15" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".25;.6;.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="126" fill="#d1fae5" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Print</text>
  </g>

  <path d="M346 130 H456" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 14">
    <animate attributeName="stroke-dashoffset" values="0;-64" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M736 130 H846" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 14">
    <animate attributeName="stroke-dashoffset" values="0;-64" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <rect x="-240" y="0" width="220" height="260" fill="url(#shine)" opacity=".5">
    <animate attributeName="x" values="-240;1220" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
