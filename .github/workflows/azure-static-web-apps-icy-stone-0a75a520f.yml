name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Deny all permissions by default; grant only what each job needs.
permissions: {}

# Prevent duplicate deploys when master receives several pushes close together.
# Only the newest production deploy should continue.
concurrency:
  group: azure-deploy-production
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    # Hard gate: skip entirely if triggered by anyone other than the repo owner.
    if: github.actor == 'exzile'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Targets the production environment — enable required-reviewer protection in
    # GitHub → Settings → Environments → production for a second approval layer.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check WASM bundle-size budget
        run: npm run check:wasm-budget
      - name: Build app
        run: npm run build
      - name: Deploy config and production smoke test
        run: npm run deploy:check
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_STONE_0A75A520F }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          skip_app_build: true
