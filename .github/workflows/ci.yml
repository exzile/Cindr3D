name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master] # master is covered by the Azure SWA deploy workflow

# Cancel the in-progress run for the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0" # matches the Azure SWA production deploy
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: WASM bundle budget
        run: npm run check:wasm-budget

      - name: i18n string consistency
        run: npm run i18n:check
