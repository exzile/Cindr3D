name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:

# Deny all permissions by default; grant only what each job needs.
permissions: {}

# Prevent concurrent deploys. A queued run will wait; a superseded one is cancelled.
concurrency:
  group: azure-deploy-production
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    # Hard gate: skip entirely if triggered by anyone other than the repo owner.
    if: github.actor == 'exzile'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Targets the production environment — enable required-reviewer protection in
    # GitHub → Settings → Environments → production for a second approval layer.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               return await core.getIDToken()
           result-encoding: string
      - name: Check WASM bundle-size budget
        run: npm run check:wasm-budget
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_TREE_0F18E8C0F }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
